name: Security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code:
    name: Code scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install bandit==1.9.4
      - run: bandit -r campus_notifier events notifications manage.py -f screen

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose

  image:
    name: Image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t campus-notifier:dev .
      - name: Trivy severity table
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.70.0 image --scanners vuln --severity HIGH,CRITICAL --format table --exit-code 0 campus-notifier:dev
      - name: Trivy findings
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/reports" aquasec/trivy:0.70.0 image --scanners vuln --severity HIGH,CRITICAL --format json --output /reports/trivy-results.json campus-notifier:dev
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-findings
          path: trivy-results.json

  iac:
    name: IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: false
